<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Quan Adaptor</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117; color: #e6edf3;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 1rem;
  }
  form { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; width: 100%; max-width: 320px; }
  .logo { display: block; width: 48px; height: 48px; border-radius: 8px; margin: 0 0 1rem; }
  h1 { font-size: 1.1rem; margin: 0 0 1.25rem; }
  label { display: block; font-size: 0.8rem; color: #8b949e; margin: 0.75rem 0 0.25rem; }
  input {
    width: 100%; box-sizing: border-box; padding: 0.55rem 0.7rem;
    border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 0.95rem;
  }
  button {
    width: 100%; margin-top: 1.25rem; padding: 0.6rem; border: none; border-radius: 6px;
    background: #238636; color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  p.err { color: #f85149; font-size: 0.85rem; margin: 0.75rem 0 0; }
</style>
</head>
<body>
  <form id="login-form">
    <img class="logo" alt="Quan Adaptor" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAACAUlEQVR42u2bQW7jMAxFPwtpdoFr+Ca5Qc4xh819ikix4KUdcxaNXHdmU1OGNUA+Ae0im3qiKX0SgRpsnmdVVY0xatu2CkBFRAEcMvK72rbVGOM3n7baG17cCIAACIAACIAACIAACIAAXtScqm6elOeoKkRkGUdZfpeIQFWXYQJgcTzP8d5jHMciByyW3zWOI7z3RRvg7ve7yQERQUoJXdfBObfsxlERoKpomgYhBEzTtPi0+VlPPW924Hq9omkaswPWCMgbcLlckFIyb4ApArJN04Su63A6neokMOcQQsAwDPZnWHOAqv6TA46OgL9zgCkCrN/tetHrrHzkSbA+BdbJkfcAAiAAAiAAAiAAAiCAn9wEaztQux5RHUDteoSrvfsppc3O71mPcLUWnhdwPp/R9/2mBexZj6geAbfbzazn96hHVM8BFj2/Zz3ivzgFLHp+r3oEL0IEQAAEQAAEQAAE8Lr1gBI5au3Pl+r5bzc/1a9hAVBSkLD250v1/Pr98A4oKYi0bWuKgJL+fKmez799bxrMocdjsoshiTGqJQJK+vPFel4VEMGcBtwuv/FId4h402dgioBlcmF/vljPu1/4CD2mIUDg8fl/ioNyQEl/vljPPyPg8cwBIt4eAdbkUdqfL9bzed5yAthOAl6ECIAACIAACIAACIAACIAAXtP+AIJIO8lYmc/TAAAAAElFTkSuQmCC" />
    <h1>Sign in to continue</h1>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="submit-btn">Sign in</button>
    <p class="err" id="error"></p>
  </form>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const cfg = await fetch("/auth-config").then((r) => r.json());
    const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get("redirect") || "/";

    const form = document.getElementById("login-form");
    const btn = document.getElementById("submit-btn");
    const errEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in…";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = error.message;
        btn.disabled = false;
        btn.textContent = "Sign in";
        return;
      }

      window.location.href = redirectTo;
    });
  </script>
</body>
</html>
